[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruya-rag"
version = "0.1.0"
description = "Arabic historical dream-text retrieval and grounded API"
requires-python = ">=3.12"
dependencies = ["PyMuPDF==1.28.2", "pydantic==2.14.0", "numpy==2.5.3", "sentence-transformers==6.1.0", "faiss-cpu==1.15.1", "fastapi==0.143.0", "uvicorn==0.54.0", "httpx==0.28.1", "python-dotenv==1.2.4"]

[project.optional-dependencies]
lessons = ["numpy==2.5.3", "scikit-learn==1.9.1", "sentence-transformers==6.1.0"]

[tool.setuptools.packages.find]
include = ["backend*"]
